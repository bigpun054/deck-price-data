name: edhrec-probe
on: { push: { branches: [edhrec-probe] } }
permissions: { contents: write }
jobs:
  testset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/edhrec_testset.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add testset && git commit -qm "Test set from EDHREC" && git push origin HEAD:edhrec-probe
