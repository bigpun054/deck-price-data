name: Inspect MTGJSON columns
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: mkdir -p out && python3 inspect_cards.py > out/inspect.txt 2>&1
      - name: Save the report on the probe branch
        if: always()
        run: |
          cd out
          git init -q -b probe
          git add -A
          git -c user.name="probe-bot" -c user.email="probe-bot@users.noreply.github.com" commit -qm "probe $(date -u +%FT%TZ)"
          git push -f "$REMOTE" probe
